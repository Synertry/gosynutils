name: Release

on:
  push:
    branches:
      - release

permissions:
  contents: write # Required to push tags and create releases

jobs:
  release:
    name: Tag & Publish
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6.0.2
        with:
          fetch-depth: 0 # fetch all history
          filter: blob:none # exclude file contents for faster checkout
          token: ${{ secrets.PAT }}

      - name: Setup Go
        uses: actions/setup-go@v6.4.0
        with:
          go-version: '^1'
          check-latest: true

      - name: Calculate Next Version
        id: semver
        uses: PaulHatch/semantic-version@v6.0.2
        with:
          # Default to patch if no pattern matches (e.g., fix:, chore:, etc.)
          # Search for the last tag across all commits (safer)
          search_commit_body: true
          enable_prerelease_mode: true
          ignore_commits_pattern: '/^docs|^chore|^style|^refactor|^perf|^test|^ci|^build|^revert/'

      - name: Create & Push Tag
        env:
          NEXT_TAG: ${{ steps.semver.outputs.version_tag }}
          REPO: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.PAT }} # Personal Access Token with repo permissions for pushing tags and creating releases
        run: |
          # Check if tag already exists (idempotency)
          if git rev-parse "$NEXT_TAG" >/dev/null 2>&1; then
            echo "Tag $NEXT_TAG already exists. Skipping."
            exit 0
          fi

          # Capture the previous tag before creating the new one, for the changelog range.
          PREV_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")

          # 1. Create the Git Tag
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "$NEXT_TAG" -m "Release $NEXT_TAG"
          git push origin "$NEXT_TAG"

          # 2. Build the changelog before publishing anything. notify.yaml fires
          # the instant a release is published (release: published), so the
          # body must already be final - editing it afterward would race
          # notify.yaml's own `gh release view` read.
          NOTES="- Initial release"
          if [ -n "$PREV_TAG" ]; then
            COMPARE_JSON=$(gh api "repos/${REPO}/compare/${PREV_TAG}...${NEXT_TAG}" 2>/dev/null || true)
            if [ -n "$COMPARE_JSON" ]; then
              NOTES=$(printf '%s' "$COMPARE_JSON" | jq -r --arg repo_url "https://github.com/${REPO}" '
                (.commits // [])
                | reverse
                | map(
                    ((.commit.message | split("\n")[0]) | gsub("[][]"; "")) as $raw
                    | ([ $raw | scan("#([0-9]+)") ] | (.[-1][0] // null)) as $pr
                    | ($raw | sub(" *[(]#[0-9]+[)] *$"; "")) as $title
                    | "- " + $title + (
                        if $pr != null
                        then " ([#\($pr)](\($repo_url)/pull/\($pr)))"
                        else " ([\(.sha[0:7])](\(.html_url)))"
                        end
                      )
                  )
                | join("\n")
              ' 2>/dev/null)
              [ -z "$NOTES" ] && NOTES="- Initial release"
            fi
          fi

          # 3. Create GitHub Release with the already-formatted changelog
          echo "Creating GitHub Release..."
          gh release create "$NEXT_TAG" --notes "$NOTES" --title "$NEXT_TAG"
